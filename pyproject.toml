[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-hadis"
version = "0.1.0"
description = "Build Quran verse JSON files enriched with hadith references."
requires-python = ">=3.9"
dependencies = [
  "jupyter>=1.0.0",
  "notebook>=6.4.0",
  "ipython>=7.0.0",
  "pandas>=1.3.0",
  "requests>=2.26.0",
  "python-Levenshtein>=0.12.0",
  "fuzzywuzzy>=0.18.0",
]

[tool.setuptools]
py-modules = []
